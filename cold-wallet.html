<body>
  <h2>🔐 离线地址生成器</h2>
  <div class="status">
    <div class="net" id="net-warning">⚠️ 设备当前已联网！请开启飞行模式并关闭 Wi-Fi 和蓝牙后再生成或输入助记词。</div>
    <div id="app-status"></div>
    <div class="mono" id="app-hash"></div>
  </div>

  <!-- 1. 助记词 -->
  <div class="card">
    <h3>1. 助记词与第 25 个词</h3>
    <button id="btn-gen" class="secondary">🎲 离线随机生成新的 24 词助记词</button>
    <div id="backup" class="backup" style="display:none;">
      <div class="hint">⚠️ 请用纸笔<b>按编号</b>逐个抄写以下 24 个词，并核对一遍。<br>这是所有地址唯一的备份。不要截屏、不要复制、不要拍照。</div>
      <div class="words" id="words"></div>
      <button class="secondary" id="btn-backup-done">我已抄写并核对完毕，隐藏</button>
    </div>

    <label class="field" for="mnemonic-input">助记词（空格分隔）</label>
    <textarea id="mnemonic-input" rows="3" placeholder="输入手抄的助记词" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

    <label class="field" for="passphrase-input">第 25 个词 / Passphrase（可选，不设则两栏都留空）</label>
    <input type="password" id="passphrase-input" placeholder="Passphrase" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <input type="password" id="passphrase-confirm" placeholder="再次输入 Passphrase 确认" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="margin-top:8px;">

    <button id="btn-unlock">解锁</button>
    <div id="wallet-msg" class="msg"></div>
    <button class="danger" id="btn-lock">🔒 锁定并清空所有内容</button>
  </div>

  <!-- 2. 地址列表 -->
  <div class="card" id="list-card" style="display:none;">
    <h3>2. 地址列表</h3>
    <div class="hint">同一编号下有一个 EVM 地址和一个 Solana 地址。用完一个编号就改用下一个，<b>请在纸上记下你用到了第几号</b>。</div>
    <div id="addr-list"></div>
    <div class="pager">
      <button class="secondary" id="btn-prev">‹ 上一页</button>
      <button class="secondary" id="btn-next">下一页 ›</button>
    </div>
    <label class="field" for="jump-input">跳到编号</label>
    <div class="pager">
      <input type="number" id="jump-input" min="0" max="2147483647" inputmode="numeric" placeholder="例如 12">
      <button class="secondary small" id="btn-jump">打开</button>
    </div>
  </div>

  <!-- 3. 单个地址 -->
  <div class="card" id="detail-card" style="display:none;">
    <h3 id="detail-title"></h3>
    <div class="tabs">
      <button id="tab-evm" class="on">EVM（0x）</button>
      <button id="tab-sol">Solana</button>
    </div>
    <div class="hint" id="chain-note"></div>
    <div class="hint mono" id="detail-path" style="margin-top:6px;"></div>

    <div class="hint" style="margin-top:10px;">收款地址：</div>
    <div class="addr" id="detail-addr"></div>
    <div style="text-align:center;"><div class="qr-center"><canvas id="canvas-addr"></canvas></div></div>

    <div class="danger-box">
      <div style="color:#ff453a; font-weight:700;">🔑 私钥二维码（导入联网钱包用）</div>
      <div id="reveal-step">
        <label class="check"><input type="checkbox" id="chk-reveal"><span>周围没有其他人和摄像头。我知道私钥导入联网钱包后，<b>这个编号就视为已暴露</b>，用完应改用下一个编号。</span></label>
        <button class="danger" id="btn-reveal" disabled>显示私钥二维码</button>
      </div>
      <div id="secret-box" style="display:none; text-align:center;">
        <div class="qr-center"><canvas id="canvas-secret"></canvas></div>
        <div class="secret" id="secret-text"></div>
        <div class="hint" id="secret-timer" style="margin-top:6px;"></div>
        <button class="danger" id="btn-hide">立即隐藏私钥</button>
      </div>
    </div>
  </div>

</body>
</html>
